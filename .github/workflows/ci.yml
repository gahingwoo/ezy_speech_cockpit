name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Types, lint and styles
        run: make codecheck

  browser:
    needs: codecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: make NODE_ENV=production
      # The runner is thrown away afterwards, so the test user's password is
      # made up here and never leaves it.
      - name: Cockpit, a test user, the stand-in ezyspeech and the module
        run: |
          TEST_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$TEST_PASSWORD"
          echo "TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          sudo TEST_PASSWORD="$TEST_PASSWORD" test/prepare-host.sh
          # The runner image points XDG_CONFIG_HOME at the runner's own home in
          # /etc/environment, which every login reads, so Cockpit's bridge for
          # the test user went looking in /home/runner/.config and died.
          sudo sed -i '/^XDG_CONFIG_HOME=/d' /etc/environment
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: make check
      - name: What Cockpit said
        if: failure()
        run: |
          curl -sk -o /dev/null -w 'login as the test user: %{http_code}\n' \
               -u "ezytester:$TEST_PASSWORD" https://localhost:9090/cockpit/login || true
          sudo journalctl --no-pager --since -2min | grep -v pam_ssh_add | grep -iE 'cockpit|bridge|ezytester|session' | tail -60 || true
          cockpit-bridge --version || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
